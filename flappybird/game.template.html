<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>像素鸟 Flappy Bird</title>
<!--
  素材来源: samuelcust/flappy-bird-assets (原版 Flappy Bird 素材, 见 assets/LICENSE)
  构建方式: node build.js 将 assets/ 内嵌为 base64, 生成单文件 flappy.html
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #2b2b2b;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
  #stage { position: relative; display: inline-block; }
  #aiBtn {
    position: absolute;
    top: 8px; right: 8px;
    z-index: 10;
    font: bold 16px/1.5 "Courier New", monospace;
    color: #fff;
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid #fff;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  }
  #aiBtn.on { background: rgba(46, 139, 87, 0.85); }
  #aiClearBtn, #sndBtn {
    position: absolute;
    right: 8px;
    z-index: 10;
    font: bold 12px/1.4 "Courier New", monospace;
    color: #fff;
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid #fff;
    border-radius: 8px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #aiClearBtn { top: 54px; }
  #sndBtn { top: 84px; }
  #sndBtn.off { background: rgba(139, 0, 0, 0.75); }
</style>
</head>
<body>
<div id="stage">
<canvas id="game"></canvas>
<button id="aiBtn" type="button">AI 演示: 关</button>
<button id="aiClearBtn" type="button">清除 AI 最高分</button>
<button id="sndBtn" type="button">音效: 开</button>
</div>
<script>
"use strict";

/* ---------- 内嵌素材 (build.js 注入 base64) ---------- */
const IMG_SRC = {
  bg_day:    "@@img_background_day@@",
  bg_night:  "@@img_background_night@@",
  base:      "@@img_base@@",
  pipe:      "@@img_pipe_green@@",
  pipe_red:  "@@img_pipe_red@@",
  msg:       "@@img_message@@",
  gameover:  "@@img_gameover@@",
  medal_platinum: "@@img_medal_platinum@@",
  medal_gold:     "@@img_medal_gold@@",
  medal_silver:   "@@img_medal_silver@@",
  medal_bronze:   "@@img_medal_bronze@@",
  digits: {
    0:"@@img_0@@",1:"@@img_1@@",2:"@@img_2@@",3:"@@img_3@@",4:"@@img_4@@",
    5:"@@img_5@@",6:"@@img_6@@",7:"@@img_7@@",8:"@@img_8@@",9:"@@img_9@@"
  },
  birds: {
    yellow: { up:"@@img_yellowbird_upflap@@", mid:"@@img_yellowbird_midflap@@", down:"@@img_yellowbird_downflap@@" },
    blue:   { up:"@@img_bluebird_upflap@@",   mid:"@@img_bluebird_midflap@@",   down:"@@img_bluebird_downflap@@" },
    red:    { up:"@@img_redbird_upflap@@",    mid:"@@img_redbird_midflap@@",    down:"@@img_redbird_downflap@@" }
  }
};
const SND_SRC = {
  wing:   "@@snd_wing@@",
  point:  "@@snd_point@@",
  hit:    "@@snd_hit@@",
  die:    "@@snd_die@@",
  swoosh: "@@snd_swoosh@@"
};

/* ---------- 常量: 原版 288x512 逻辑分辨率, 60fps 步进 ---------- */
const W = 288, H = 512;
const GROUND_H = 112, GROUND_Y = H - GROUND_H;      // 地面顶边 y=400
const PIPE_W = 52, PIPE_GAP = 100, PIPE_SPACING = 170;
const SPEED = 2;                                     // 管道/地面滚动速度 px/帧
const GRAVITY = 0.45, FLAP = -7, MAX_FALL = 10;      // 单次起跳约 54px, 适配 100px 间隙
const BIRD_X = 52, BIRD_W = 34, BIRD_H = 24;
const HIT_INSET_X = 4, HIT_INSET_Y = 3;              // 判定框比贴图略小, 同原版宽容度

/* ---------- 素材加载 ---------- */
function loadImg(src) { const i = new Image(); i.src = src; return i; }
const IMG = {
  bg_day: loadImg(IMG_SRC.bg_day), bg_night: loadImg(IMG_SRC.bg_night),
  base: loadImg(IMG_SRC.base), pipe: loadImg(IMG_SRC.pipe), pipe_red: loadImg(IMG_SRC.pipe_red),
  msg: loadImg(IMG_SRC.msg), gameover: loadImg(IMG_SRC.gameover),
  medal_platinum: loadImg(IMG_SRC.medal_platinum), medal_gold: loadImg(IMG_SRC.medal_gold),
  medal_silver: loadImg(IMG_SRC.medal_silver), medal_bronze: loadImg(IMG_SRC.medal_bronze),
  digits: {}, birds: {}
};
for (const d in IMG_SRC.digits) IMG.digits[d] = loadImg(IMG_SRC.digits[d]);
for (const c in IMG_SRC.birds) IMG.birds[c] = {
  up: loadImg(IMG_SRC.birds[c].up), mid: loadImg(IMG_SRC.birds[c].mid), down: loadImg(IMG_SRC.birds[c].down)
};
const SND = {};
for (const k in SND_SRC) SND[k] = new Audio(SND_SRC[k]);
let sndOn = localStorage.getItem("flappy_snd") !== "off";   // 音效开关持久化 (离线快测时务必关)
function play(name, vol) {
  if (!sndOn) return;
  const s = SND[name].cloneNode();
  s.volume = vol == null ? 0.55 : vol;
  s.play().catch(() => {});
}

/* ---------- 画布与自适应缩放 ---------- */
const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d");
cvs.width = W; cvs.height = H;
ctx.imageSmoothingEnabled = false;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cvs.style.width = Math.round(W * s) + "px";
  cvs.style.height = Math.round(H * s) + "px";
}
addEventListener("resize", fit); fit();

/* ---------- 游戏状态 ---------- */
let state = "ready";          // ready | play | dying | over
let frame = 0, score = 0, pipes = [], groundX = 0;
let night = false, pipesSinceSwitch = 0, flash = 0, overAt = 0;
let bgMix = 0;                        // 背景渐变系数: 0=白天 1=夜晚, 每帧向目标缓动 (~0.8s 过渡)
let best = +(localStorage.getItem("flappy_best") || 0);
let birdColor = localStorage.getItem("flappy_color") || "yellow";
if (!IMG.birds[birdColor]) birdColor = "yellow";
const bird = { y: 0, v: 0, angle: 0, wing: 0 };

function resetBird() {
  bird.y = 272; bird.v = 0; bird.angle = 0; bird.wing = 0;
}
function resetGame() {
  state = "ready"; score = 0; pipes = []; flash = 0;
  resetBird();
}
resetBird();

/* ---------- 玩家操作记录 (供 AI 设计): 每次按键瞬间记录局面, 局末上传服务器存文件 ---------- */
let opRec = null;                     // 本局操作记录 {ts, startFrame, flaps: []}

// 按键瞬间的局面快照: 鸟状态 + 当前决策对象柱子(距离/缺口) + 柱子间距 (速度取按键前一刻)
// "当前决策对象"判定与 situation() 一致: 鸟尾未出管口时该管仍是决策对象
function snapshot() {
  const ahead = pipes.filter(p => p.x + PIPE_W > BIRD_X + HIT_INSET_X).sort((a, b) => a.x - b.x);
  const p1 = ahead[0], p2 = ahead[1];
  const gapCenter = p1 ? p1.gapY + PIPE_GAP / 2 : 220;
  return {
    f: frame,                                            // 帧号 (60fps)
    by: Math.round(bird.y * 10) / 10,                    // 鸟顶边 y
    bv: Math.round(bird.v * 100) / 100,                  // 按键前速度 (负=上升)
    dx: p1 ? Math.round(p1.x - (BIRD_X + BIRD_W)) : null,// 鸟前端到下一柱左缘的水平距离
    gapY: p1 ? Math.round(p1.gapY * 10) / 10 : null,     // 下一柱缺口上沿 y
    gapH: PIPE_GAP,                                      // 缺口高度 (本局固定)
    dy: Math.round((bird.y + BIRD_H / 2 - gapCenter) * 10) / 10, // 鸟中心-缺口中心 (正=偏低)
    spacing: p2 ? Math.round(p2.x - p1.x) : PIPE_SPACING,// 与再下一柱的水平间距
    score: score
  };
}

function uploadRecording(data) {
  try {
    fetch("/record", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).catch(() => saveLocalRun(data));
  } catch (e) { saveLocalRun(data); }
}
function saveLocalRun(data) {          // 服务器不可用时的兜底: 存 localStorage (保留最近 5 局)
  try {
    const runs = JSON.parse(localStorage.getItem("flappy_runs") || "[]");
    runs.push(data);
    localStorage.setItem("flappy_runs", JSON.stringify(runs.slice(-5)));
  } catch (e) {}
}

function spawnPipe() {
  const gapY = 60 + Math.random() * (GROUND_Y - PIPE_GAP - 120);
  pipes.push({ x: W, gapY: gapY, scored: false });
}

function flap() {
  if (opRec) opRec.flaps.push(snapshot());           // 按键瞬间: 记录按键前的局面 (玩家与 AI 局都记, isAI 区分)
  bird.v = FLAP;
  play("wing");
}

function startPlay() {
  state = "play";
  opRec = { ts: new Date().toISOString(), startFrame: frame, flaps: [] };
  pipes = [];
  spawnPipe();
  pipes[0].x = W + 40;                 // 首根管道稍远一点, 留出反应时间
  flap();
  play("swoosh", 0.4);
}

function die(cause, hitPipe) {
  state = "dying";
  play("hit", 0.7); play("swoosh", 0.4);
  flash = 1;
  if (opRec) {                       // 局末: 补上死亡局面并上传整局操作记录
    opRec.score = score;
    opRec.best = best;
    opRec.frames = frame - opRec.startFrame;
    opRec.death = snapshot();
    opRec.death.cause = cause || "unknown";
    if (hitPipe)                     // 撞上的那根柱子的缺口中心偏差 (snapshot 里的 dy 可能已是下一根)
      opRec.death.dyHit = Math.round((bird.y + BIRD_H / 2 - (hitPipe.gapY + PIPE_GAP / 2)) * 10) / 10;
    uploadRecording(opRec);
    opRec = null;
  }
  if (aiOn && score > aiBest) {        // AI 自打分: 记录自己的历史最高分
    aiBest = score;
    localStorage.setItem("flappy_ai_best", aiBest);
  }
}

/* ---------- 局面特征: 鸟相对下一根管道间隙中心的高度差 dy / 速度 v / 管道距离 dx ----------
   注意: 判定范围含正在穿过的管道 (鸟尾未出管口时该管仍是决策对象),
   否则 AI 会在管内按"下一根"的缺口做决策, 撞当前管上沿 */
function situation() {
  const ahead = pipes.find(p => p.x + PIPE_W > BIRD_X + HIT_INSET_X);
  let dy = ahead ? bird.y - (ahead.gapY + PIPE_GAP / 2 - BIRD_H / 2) : bird.y - 220;
  let v = bird.v;
  const dx = ahead ? Math.min(340, ahead.x - BIRD_X) : 340;
  dy = Math.max(-160, Math.min(110, dy));
  v = Math.max(-7, Math.min(7, v));
  return [dy, v, dx];
}

/* ---------- 输入 ---------- */
function onAction() {
  if (aiOn) return;                  // AI 回放期间忽略手动操作
  if (state === "ready") { startPlay(); }
  else if (state === "play") { flap(); }
  else if (state === "over" && frame - overAt > 40) { resetGame(); play("swoosh", 0.4); }
}
cvs.addEventListener("pointerdown", e => { e.preventDefault(); onAction(); });
addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
    e.preventDefault();
    if (!e.repeat) onAction();
  } else if (e.code === "KeyC" && state === "ready") {
    const order = ["yellow", "blue", "red"];
    birdColor = order[(order.indexOf(birdColor) + 1) % 3];
    localStorage.setItem("flappy_color", birdColor);
    play("swoosh", 0.4);
  } else if (e.code === "KeyA") {
    setAI(!aiOn);
  }
});
document.addEventListener("visibilitychange", () => { last = null; });

/* ---------- AI 演示 (按钮或 A 键开关): 策略提炼自玩家实玩录制 (recordings/*.json) ----------
   参数来源: 爬升连拍间隔 13 帧 / 最短按键间隔 10 帧 / 补拍位置 dy>=18
   (单次拍翅固定上升 54px, 判定安全区 |dy|<=41, dy>=18 补拍则波峰 dy≈-36 不顶到上沿)。
   AI 自己玩、自打分 (aiBest 持久化, 可用"清除 AI 最高分"按钮归零),
   死后自动重开循环演示; AI 的对局同样上传记录文件 (isAI: true) 供分析优化。 */
let aiOn = false;
let aiBest = +(localStorage.getItem("flappy_ai_best") || 0);
const aiBtn = document.getElementById("aiBtn");
const aiClearBtn = document.getElementById("aiClearBtn");

function setAI(on) {
  aiOn = on;
  aiBtn.textContent = "AI 演示: " + (on ? "开" : "关");
  aiBtn.classList.toggle("on", on);
  localStorage.setItem("flappy_ai_on", on ? "1" : "0");   // 开关状态持久化, 刷新后延续
  if (on && state === "over") resetGame();
}
aiBtn.addEventListener("click", () => setAI(!aiOn));
aiClearBtn.addEventListener("click", () => {     // 归零 AI 自打分 (含持久化)
  aiBest = 0;
  localStorage.removeItem("flappy_ai_best");
});

const sndBtn = document.getElementById("sndBtn");
function setSnd(on) {
  sndOn = on;
  sndBtn.textContent = "音效: " + (on ? "开" : "关");
  sndBtn.classList.toggle("off", !on);
  localStorage.setItem("flappy_snd", on ? "on" : "off");
}
sndBtn.addEventListener("click", () => setSnd(!sndOn));
if (!sndOn) { sndBtn.textContent = "音效: 关"; sndBtn.classList.add("off"); }

let aiLastFlap = -99;                    // 上次 AI 拍翅帧号 (强制间隔, 模仿人类点击节奏)

function startAIPlay() {
  state = "play";
  aiLastFlap = frame;
  opRec = { ts: new Date().toISOString(), startFrame: frame, flaps: [], isAI: true };
  pipes = [];
  spawnPipe();
  pipes[0].x = W + 40;
  flap();                                         // 与人类开局操作一致
  play("swoosh", 0.4);
}

// 玩家录制提炼出的操作策略: 爬升连拍 / 中线以下安全补拍
// 关键几何: 单次拍翅固定上升 54px, 判定安全区 |dy|<=41 → 只有 dy>=18 时补拍, 上升后仍不顶到上沿
// (旧版"远端高度维持"会在管道逼近时高位补拍, 上升 54px 撞缺口上沿 — 录制诊断 13/14 死因, 已删)
function policyFlap() {
  const s = situation();
  const dy = s[0], v = s[1];
  const since = frame - aiLastFlap;
  if (dy > 55) {                                  // 明显低于缺口中心: 玩家式连拍爬升 (间隔 13 帧)
    if (since >= 13) { flap(); aiLastFlap = frame; }
    return;
  }
  if (dy >= 18 && v > 0 && since >= 10) {         // 缺口中线以下且在下落: 补拍, 波峰 dy≈-36 安全
    flap();
    aiLastFlap = frame;
  }
}

function aiStep() {
  if (state === "ready") { startAIPlay(); return; }
  if (state === "over" && frame - overAt > 60) resetGame();   // 循环演示
  if (state === "play") policyFlap();
}

/* ---------- 更新 ---------- */
function update() {
  frame++;
  if (flash > 0) flash = Math.max(0, flash - 0.08);
  bgMix += (night ? 1 : -1) * 0.025;              // 昼夜背景渐变过渡
  bgMix = Math.max(0, Math.min(1, bgMix));
  if (aiOn) aiStep();

  if (state === "ready") {
    bird.y = 272 + Math.sin(frame * 0.12) * 7;
    bird.wing++;
    groundX = (groundX - SPEED) % IMG.base.width;
    return;
  }

  if (state === "play") {
    // 鸟物理
    bird.v = Math.min(bird.v + GRAVITY, MAX_FALL);
    bird.y += bird.v;
    if (bird.y < 0) { bird.y = 0; bird.v = 0; }
    bird.angle = bird.v < 0 ? -0.42 : Math.min((bird.v / MAX_FALL) * 1.57, 1.57);
    bird.wing++;

    // 管道滚动与生成
    for (const p of pipes) p.x -= SPEED;
    if (pipes.length && pipes[pipes.length - 1].x <= W - PIPE_SPACING) spawnPipe();
    pipes = pipes.filter(p => p.x + PIPE_W > 0);
    groundX = (groundX - SPEED) % IMG.base.width;

    // 计分
    for (const p of pipes) {
      if (!p.scored && p.x + PIPE_W < BIRD_X) {
        p.scored = true; score++;
        play("point"); play("swoosh", 0.3);
        if (aiOn && score > aiBest) {          // 自打分实时刷新 (AI 可能长期不死, 不能只在死亡时更新)
          aiBest = score;
          localStorage.setItem("flappy_ai_best", aiBest);
        }
        pipesSinceSwitch++;
        if (pipesSinceSwitch >= 4) { pipesSinceSwitch = 0; night = !night; }
      }
    }

    // 碰撞: 地面 + 管道 (判定框内缩, 同原版)
    const bx = BIRD_X + HIT_INSET_X, by = bird.y + HIT_INSET_Y;
    const bw = BIRD_W - HIT_INSET_X * 2, bh = BIRD_H - HIT_INSET_Y * 2;
    if (by + bh >= GROUND_Y) { bird.y = GROUND_Y - BIRD_H; die("ground"); return; }
    for (const p of pipes) {
      if (bx + bw > p.x && bx < p.x + PIPE_W &&
          (by < p.gapY || by + bh > p.gapY + PIPE_GAP)) { die("pipe", p); return; }
    }
    return;
  }

  if (state === "dying") {
    bird.v = Math.min(bird.v + GRAVITY, MAX_FALL);
    bird.y += bird.v;
    bird.angle = Math.min(bird.angle + 0.12, 1.57);
    if (bird.y + BIRD_H >= GROUND_Y) {
      bird.y = GROUND_Y - BIRD_H;
      state = "over"; overAt = frame;
      play("die", 0.7);
      if (score > best) { best = score; localStorage.setItem("flappy_best", best); }
    }
    return;
  }
  // state === "over": 静止等待重开
}

/* ---------- 绘制 ---------- */
function drawDigits(str, cx, y, scale) {
  scale = scale || 1;
  let total = 0;
  for (const ch of str) total += IMG.digits[ch].width * scale + 2;
  total -= 2;
  let x = Math.round(cx - total / 2);
  for (const ch of str) {
    const im = IMG.digits[ch];
    ctx.drawImage(im, x, y, im.width * scale, im.height * scale);
    x += im.width * scale + 2;
  }
}
function drawDigitsRight(str, right, y, scale) {
  scale = scale || 1;
  let total = 0;
  for (const ch of str) total += IMG.digits[ch].width * scale + 2;
  total -= 2;
  let x = right - total;
  for (const ch of str) {
    const im = IMG.digits[ch];
    ctx.drawImage(im, x, y, im.width * scale, im.height * scale);
    x += im.width * scale + 2;
  }
}
function outlinedText(txt, x, y, size, align) {
  ctx.font = "bold " + size + "px 'Arial Black', Arial, sans-serif";
  ctx.textAlign = align || "center";
  ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(3, size / 4);
  ctx.strokeStyle = "#553a17";
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = "#ffffff";
  ctx.fillText(txt, x, y);
}
function medalFor(s) {
  if (s >= 40) return IMG.medal_platinum;
  if (s >= 30) return IMG.medal_gold;
  if (s >= 20) return IMG.medal_silver;
  if (s >= 10) return IMG.medal_bronze;
  return null;
}

function draw() {
  // 背景: 白天为底, 夜晚按 bgMix 叠加淡入淡出 (渐变过渡, 不突变)
  ctx.drawImage(IMG.bg_day, 0, 0);
  if (bgMix > 0) {
    ctx.globalAlpha = bgMix;
    ctx.drawImage(IMG.bg_night, 0, 0);
    ctx.globalAlpha = 1;
  }

  // 管道
  for (const p of pipes) {
    ctx.drawImage(IMG.pipe, p.x, p.gapY + PIPE_GAP);                            // 下管
    ctx.save();                                                                  // 上管(翻转)
    ctx.translate(p.x, p.gapY);
    ctx.scale(1, -1);
    ctx.drawImage(IMG.pipe, 0, 0);                                               // 翻转后占 gapY-320..gapY
    ctx.restore();
  }

  // 地面
  for (let x = groundX; x < W; x += IMG.base.width)
    ctx.drawImage(IMG.base, Math.round(x), GROUND_Y);

  // 准备界面海报先画, 鸟浮在海报之上 (同原版)
  if (state === "ready")
    ctx.drawImage(IMG.msg, Math.round((W - IMG.msg.width) / 2), 120);

  // 鸟
  const bset = IMG.birds[birdColor];
  const cycle = ["mid", "up", "mid", "down"];
  const wing = state === "dying" ? bset.down : bset[cycle[Math.floor(bird.wing / 7) % 4]];
  ctx.save();
  ctx.translate(BIRD_X + BIRD_W / 2, bird.y + BIRD_H / 2);
  ctx.rotate(bird.angle);
  ctx.drawImage(wing, -BIRD_W / 2, -BIRD_H / 2);
  ctx.restore();

  // 分数
  if (state === "play" || state === "dying") drawDigits(String(score), W / 2, 44);

  // AI 自打分
  if (aiOn) outlinedText("AI 最佳: " + aiBest, 8, 22, 12, "left");

  // 准备界面提示
  if (state === "ready" && Math.floor(frame / 30) % 2 === 0)
    outlinedText("点击 / 空格 开始", W / 2, 420, 16);

  // 结算面板
  if (state === "over") {
    ctx.drawImage(IMG.gameover, Math.round((W - IMG.gameover.width) / 2), 88);
    const px = 32, py = 148, pw = 224, ph = 150;
    ctx.fillStyle = "#dedeb6";
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = "#555555"; ctx.lineWidth = 2;
    ctx.strokeRect(px + 1, py + 1, pw - 2, ph - 2);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1;
    ctx.strokeRect(px + 4, py + 4, pw - 8, ph - 8);

    outlinedText("SCORE", px + pw - 16, py + 26, 14, "right");
    drawDigitsRight(String(score), px + pw - 16, py + 34, 0.72);
    outlinedText("BEST", px + pw - 16, py + 86, 14, "right");
    drawDigitsRight(String(best), px + pw - 16, py + 94, 0.72);

    const medal = medalFor(score);
    const mx = px + 46, my = py + 74, ms = 44;                   // 22px 贴图放大 2 倍, 同原版面板比例
    if (medal) {
      ctx.drawImage(medal, mx - ms / 2, my - ms / 2, ms, ms);
    } else {
      ctx.fillStyle = "#b9b9a2";                                 // 无奖牌: 占位灰圆
      ctx.beginPath(); ctx.arc(mx, my, ms / 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#8f8f7a"; ctx.lineWidth = 2; ctx.stroke();
    }

    if (frame - overAt > 40 && Math.floor(frame / 30) % 2 === 0)
      outlinedText("点击任意位置重新开始", W / 2, 340, 15);
  }

  // 死亡白闪
  if (flash > 0) {
    ctx.fillStyle = "rgba(255,255,255," + flash.toFixed(2) + ")";
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- 恢复持久化的 AI 开关 ---------- */
if (localStorage.getItem("flappy_ai_on") === "1") setAI(true);

/* ---------- 主循环: 固定 60fps 步进 ---------- */
let last = null, acc = 0;
const STEP = 1000 / 60;
function loop(t) {
  requestAnimationFrame(loop);
  if (last == null) last = t;
  acc += Math.min(t - last, 250);
  last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
}
requestAnimationFrame(loop);
</script>
