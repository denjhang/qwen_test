<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  :root {
    --bg: #faf8ef;
    --board-bg: #bbada0;
    --cell-bg: rgba(238, 228, 218, 0.35);
    --text-dark: #776e65;
    --text-light: #f9f6f2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text-dark);
    overscroll-behavior: none;
  }
  .wrap {
    max-width: 500px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  h1 { font-size: 56px; font-weight: 800; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--board-bg);
    color: #fff;
    border-radius: 6px;
    padding: 8px 14px;
    min-width: 80px;
    text-align: center;
    position: relative;
  }
  .score-box .label { font-size: 11px; letter-spacing: 1px; color: #eee4da; }
  .score-box .value { font-size: 22px; font-weight: 700; }
  .score-add {
    position: absolute;
    left: 50%; top: 8px;
    transform: translateX(-50%);
    font-size: 22px; font-weight: 700;
    color: rgba(119, 110, 101, 0.9);
    animation: float-up 0.6s ease-in forwards;
    pointer-events: none;
  }
  @keyframes float-up {
    0% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -40px); }
  }
  .toolbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .toolbar p { font-size: 14px; }
  button {
    background: #8f7a66;
    color: var(--text-light);
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #9f8b77; }

  .board {
    position: relative;
    width: min(94vw, 468px);
    height: min(94vw, 468px);
    background: var(--board-bg);
    border-radius: 8px;
    touch-action: none;
    user-select: none;
  }
  .grid-cell, .tile {
    position: absolute;
    width: calc((100% - 5 * 10px) / 4);
    height: calc((100% - 5 * 10px) / 4);
    border-radius: 6px;
  }
  .grid-cell { background: var(--cell-bg); }
  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    transition: transform 0.12s ease-in-out;
    z-index: 2;
  }
  .tile.new { animation: pop-in 0.18s ease; }
  .tile.merged { animation: pop-merge 0.2s ease; z-index: 3; }
  /* 动画的 transform 会覆盖定位用的 translate，所以把 --tx/--ty 嵌进关键帧里，
     否则入场/合并动画期间方块会瞬移到左上角 */
  .tile { --tx: 0px; --ty: 0px; }
  @keyframes pop-in {
    0% { transform: translate(var(--tx), var(--ty)) scale(0); }
    100% { transform: translate(var(--tx), var(--ty)) scale(1); }
  }
  @keyframes pop-merge {
    0% { transform: translate(var(--tx), var(--ty)) scale(1); }
    50% { transform: translate(var(--tx), var(--ty)) scale(1.2); }
    100% { transform: translate(var(--tx), var(--ty)) scale(1); }
  }
  .t2    { background: #eee4da; font-size: clamp(24px, 8vw, 44px); }
  .t4    { background: #ede0c8; font-size: clamp(24px, 8vw, 44px); }
  .t8    { background: #f2b179; color: var(--text-light); font-size: clamp(24px, 8vw, 44px); }
  .t16   { background: #f59563; color: var(--text-light); font-size: clamp(20px, 7vw, 38px); }
  .t32   { background: #f67c5f; color: var(--text-light); font-size: clamp(20px, 7vw, 38px); }
  .t64   { background: #f65e3b; color: var(--text-light); font-size: clamp(20px, 7vw, 38px); }
  .t128  { background: #edcf72; color: var(--text-light); font-size: clamp(18px, 6vw, 34px); }
  .t256  { background: #edcc61; color: var(--text-light); font-size: clamp(18px, 6vw, 34px); }
  .t512  { background: #edc850; color: var(--text-light); font-size: clamp(18px, 6vw, 34px); }
  .t1024 { background: #edc53f; color: var(--text-light); font-size: clamp(14px, 5vw, 28px); }
  .t2048 { background: #edc22e; color: var(--text-light); font-size: clamp(14px, 5vw, 28px);
           box-shadow: 0 0 24px rgba(243, 215, 116, 0.6); }
  .tbig  { background: #3c3a32; color: var(--text-light); font-size: clamp(14px, 5vw, 28px); }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.73);
    border-radius: 8px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
    animation: fade-in 0.4s ease;
  }
  .overlay.show { display: flex; }
  .overlay .msg { font-size: 42px; font-weight: 800; }
  .overlay.win { background: rgba(237, 194, 46, 0.5); }
  .overlay.win .msg { color: #f9f6f2; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  footer { margin-top: 14px; font-size: 13px; color: #a99e94; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="label">分数</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">最高分</div><div class="value" id="best">0</div></div>
    </div>
  </header>
  <div class="toolbar">
    <p>合并相同数字，冲击 <b>2048</b>！</p>
    <div style="display:flex;gap:8px;">
      <button id="sound-toggle">🔊 声音</button>
      <button id="new-game">新游戏</button>
    </div>
  </div>
  <div class="board" id="board">
    <div class="overlay" id="overlay">
      <div class="msg" id="overlay-msg"></div>
      <button id="overlay-btn">再来一局</button>
    </div>
  </div>
  <footer>电脑：方向键 / WASD / 鼠标拖动 &nbsp;·&nbsp; 手机：滑动屏幕</footer>
</div>

<script>
(function () {
  const SIZE = 4, GAP = 10;
  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlay-msg');

  let grid;          // grid[r][c] = tile 对象或 null
  let score, best, won, over;
  let tileId = 0;

  // ---------- 布局 ----------
  function posOf(r, c) {
    const w = board.clientWidth;
    const cell = (w - GAP * (SIZE + 1)) / SIZE;
    return { x: GAP + c * (cell + GAP), y: GAP + r * (cell + GAP), cell };
  }
  function place(el, r, c) {
    const p = posOf(r, c);
    el.style.setProperty('--tx', p.x + 'px');
    el.style.setProperty('--ty', p.y + 'px');
    el.style.transform = `translate(${p.x}px, ${p.y}px)`;
  }
  function buildBackground() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const el = document.createElement('div');
        el.className = 'grid-cell';
        board.appendChild(el);
        place(el, r, c);
      }
  }

  // ---------- 音效（WebAudio 合成，无需音频文件） ----------
  let audioCtx = null;
  let soundOn = true;
  try { soundOn = localStorage.getItem('sound2048') !== 'off'; } catch (e) {}
  const soundBtn = document.getElementById('sound-toggle');
  function renderSoundBtn() {
    soundBtn.textContent = soundOn ? '🔊 声音' : '🔇 静音';
  }
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, dur, type, gain, delay) {
    const ctx = audioCtx;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + (delay || 0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function playMove() {
    if (!soundOn || !ensureAudio()) return;
    beep(220, 0.06, 'sine', 0.05);
  }
  function playMerge(val) {
    if (!soundOn || !ensureAudio()) return;
    // 数字越大，音高越高
    const freq = 300 + Math.min(10, Math.log2(val) - 1) * 60;
    beep(freq, 0.12, 'triangle', 0.12);
    beep(freq * 1.5, 0.1, 'sine', 0.06, 0.03);
  }
  function playWin() {
    if (!soundOn || !ensureAudio()) return;
    [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.25, 'triangle', 0.12, i * 0.12));
  }
  function playOver() {
    if (!soundOn || !ensureAudio()) return;
    [330, 262, 196].forEach((f, i) => beep(f, 0.3, 'sawtooth', 0.08, i * 0.18));
  }
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    try { localStorage.setItem('sound2048', soundOn ? 'on' : 'off'); } catch (e) {}
    renderSoundBtn();
    if (soundOn) { ensureAudio(); beep(440, 0.08, 'sine', 0.08); }
  });
  renderSoundBtn();

  // ---------- 状态 ----------
  function loadBest() {
    try { best = parseInt(localStorage.getItem('best2048') || '0', 10); }
    catch (e) { best = 0; }
  }
  function saveBest() {
    try { localStorage.setItem('best2048', String(best)); } catch (e) {}
  }

  function newGame() {
    board.querySelectorAll('.tile').forEach(el => el.remove());
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    score = 0; won = false; over = false;
    overlay.classList.remove('show', 'win');
    updateScore(0);
    addRandomTile();
    addRandomTile();
  }

  function updateScore(gain) {
    scoreEl.textContent = score;
    if (score > best) { best = score; saveBest(); }
    bestEl.textContent = best;
    if (gain > 0) {
      const add = document.createElement('div');
      add.className = 'score-add';
      add.textContent = '+' + gain;
      scoreEl.parentElement.appendChild(add);
      setTimeout(() => add.remove(), 600);
    }
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!grid[r][c]) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    const val = Math.random() < 0.9 ? 2 : 4;
    const el = document.createElement('div');
    el.className = `tile new t${val <= 2048 ? val : 'big'}`;
    el.textContent = val;
    board.appendChild(el);
    place(el, r, c);
    grid[r][c] = { id: ++tileId, val, el };
  }

  // ---------- 移动 ----------
  const DELTA = {
    up:    [-1, 0], down: [1, 0],
    left:  [0, -1], right: [0, 1],
  };

  function move(dir) {
    if (over) return;
    const [dr, dc] = DELTA[dir];
    const rows = [...Array(SIZE).keys()];
    const cols = [...Array(SIZE).keys()];
    if (dr === 1) rows.reverse();
    if (dc === 1) cols.reverse();

    let moved = false, gain = 0;
    const mergedPairs = [];

    for (const r of rows) for (const c of cols) {
      const tile = grid[r][c];
      if (!tile) continue;
      // 找到滑动方向上最远可停的位置
      let nr = r, nc = c;
      while (true) {
        const tr = nr + dr, tc = nc + dc;
        if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;
        if (grid[tr][tc]) {
          if (grid[tr][tc].val === tile.val && !grid[tr][tc].mergedThisTurn) {
            nr = tr; nc = tc; // 目标为可合并格
          }
          break;
        }
        nr = tr; nc = tc;
      }
      if (nr === r && nc === c) continue;

      const target = grid[nr][nc];
      grid[r][c] = null;
      if (target) {
        // 合并
        const newVal = tile.val * 2;
        gain += newVal;
        place(tile.el, nr, nc);
        mergedPairs.push([nr, nc, newVal, tile, target]);
        grid[nr][nc] = { id: ++tileId, val: newVal, el: null, mergedThisTurn: true };
        if (newVal === 2048 && !won) won = true;
      } else {
        grid[nr][nc] = tile;
        place(tile.el, nr, nc);
      }
      moved = true;
    }

    if (!moved) return;

    score += gain;
    updateScore(gain);
    playMove();
    if (mergedPairs.length) playMerge(mergedPairs[mergedPairs.length - 1][2]);

    // 合并动画：旧方块滑到位后移除，生成新方块
    setTimeout(() => {
      for (const [r, c, val, a, b] of mergedPairs) {
        a.el.remove(); b.el.remove();
        const el = document.createElement('div');
        el.className = `tile merged t${val <= 2048 ? val : 'big'}`;
        el.textContent = val;
        board.appendChild(el);
        place(el, r, c);
        grid[r][c].el = el;
        el.addEventListener('animationend', () => el.classList.remove('merged'), { once: true });
      }
      addRandomTile();
      for (const row of grid) for (const t of row) if (t) t.mergedThisTurn = false;
      if (won) showOverlay('你赢了！ 🎉', true);
      else if (!movesAvailable()) showOverlay('游戏结束', false);
    }, 130);

    if (!won && !mergedPairs.length && !movesAvailable()) showOverlay('游戏结束', false);
  }

  function movesAvailable() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return true;
        const v = grid[r][c].val;
        if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].val === v) return true;
        if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].val === v) return true;
      }
    return false;
  }

  function showOverlay(msg, isWin) {
    over = !isWin;
    overlayMsg.textContent = msg;
    overlay.classList.toggle('win', isWin);
    overlay.classList.add('show');
    if (isWin) playWin(); else playOver();
  }

  // ---------- 输入 ----------
  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right',
  };
  window.addEventListener('keydown', e => {
    const dir = KEYMAP[e.key];
    if (!dir) return;
    e.preventDefault();
    move(dir);
  });

  // 滑动：触屏 + 鼠标拖动，监听整个页面（桌面也能用鼠标滑动操作）
  let swipeStart = null;
  function onSwipeStart(x, y) { swipeStart = { x, y }; }
  function onSwipeEnd(x, y) {
    if (!swipeStart) return;
    const dx = x - swipeStart.x, dy = y - swipeStart.y;
    swipeStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }
  window.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    onSwipeStart(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    onSwipeEnd(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('mousedown', e => onSwipeStart(e.clientX, e.clientY));
  window.addEventListener('mouseup', e => onSwipeEnd(e.clientX, e.clientY));

  document.getElementById('new-game').addEventListener('click', newGame);
  document.getElementById('overlay-btn').addEventListener('click', newGame);
  window.addEventListener('resize', () => {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid && grid[r][c] && grid[r][c].el) place(grid[r][c].el, r, c);
    board.querySelectorAll('.grid-cell').forEach((el, i) =>
      place(el, Math.floor(i / SIZE), i % SIZE));
  });

  // ---------- 启动 ----------
  buildBackground();
  loadBest();
  newGame();
})();
</script>
</body>
</html>
